<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>737 FMA Trainer</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-size: 16px;
      color: #666;
    }

    .scenario {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin: 25px 0 35px;
      min-height: 60px;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fma-labels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;

      max-width: 700px;
      margin: 0 auto 4px;

      text-align: center;
      font-size: 13px;
      color: #777;
    }

    .fma {
      display: grid;
      grid-template-columns: repeat(3, 1fr);

      gap: 2px;

      max-width: 700px;
      margin: auto;

      background: #333;
      padding: 3px;
    }

    .fma select {
      width: 100%;
      height: 70px;

      background: #555;
      color: #00ff4c;

      border: none;

      font-size: 19px;
      font-weight: bold;

      text-align: center;

      cursor: pointer;
    }

    .fma select:focus {
      outline: 2px solid #00ff4c;
    }

    .correct {
      background: #215d31 !important;
    }

    .wrong {
      background: #772727 !important;
    }

    .button-row {
      text-align: center;
      margin-top: 30px;
    }

    button {
      padding: 14px 32px;

      border: none;
      border-radius: 7px;

      font-size: 17px;
      font-weight: bold;

      cursor: pointer;

      margin: 5px;
    }

    #checkButton {
      background: #222;
      color: white;
    }

    #nextButton {
      background: #3877d6;
      color: white;
      display: none;
    }

    #restartButton {
      background: #222;
      color: white;
      display: none;
    }

    .feedback {
      min-height: 35px;

      text-align: center;

      margin-top: 22px;

      font-size: 18px;
      font-weight: bold;
    }

    .correct-text {
      color: #187b35;
    }

    .wrong-text {
      color: #b02727;
    }

    .final-score {
      text-align: center;

      font-size: 38px;
      font-weight: bold;

      margin: 40px 0 15px;
    }

    .final-percent {
      text-align: center;

      font-size: 20px;

      color: #666;

      margin-bottom: 30px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px 10px;
      }

      .card {
        padding: 20px 10px;
      }

      .scenario {
        font-size: 20px;
      }

      .fma select {
        font-size: 13px;
        height: 65px;
      }

    }

  </style>

</head>


<body>

<div class="container">

  <h1>737 FMA Trainer</h1>

  <div class="subtitle">
    Autoflight Mode Practice
  </div>


  <div class="card">


    <!-- QUIZ -->

    <div id="quizArea">

      <div class="top-row">

        <div id="questionCounter">
          Question 1 / 10
        </div>

        <div id="score">
          Score: 0
        </div>

      </div>


      <div
        class="scenario"
        id="scenario">
      </div>


      <div class="fma-labels">

        <div>AUTOTHROTTLE</div>

        <div>ROLL</div>

        <div>PITCH</div>

      </div>


      <div class="fma">


        <!-- AUTOTHROTTLE -->

        <select id="at">

          <option value="">---</option>

          <option>N1</option>

          <option>MCP SPD</option>

          <option>FMC SPD</option>

          <option>ARM</option>

          <option>THR HLD</option>

          <option>RETARD</option>

          <option>GA</option>

        </select>



        <!-- ROLL -->

        <select id="roll">

          <option value="">---</option>

          <option>HDG SEL</option>

          <option>LNAV</option>

          <option>VOR/LOC</option>

          <option>FAC</option>

          <option>TO/GA</option>

          <option>ROLLOUT</option>

          <option>CWS R</option>

        </select>



        <!-- PITCH -->

        <select id="pitch">

          <option value="">---</option>

          <option>MCP SPD</option>

          <option>V/S</option>

          <option>ALT ACQ</option>

          <option>ALT HOLD</option>

          <option>VNAV SPD</option>

          <option>VNAV PTH</option>

          <option>VNAV ALT</option>

          <option>G/S</option>

          <option>G/P</option>

          <option>TO/GA</option>

          <option>FLARE</option>

          <option>CWS P</option>

        </select>


      </div>


      <div
        class="feedback"
        id="feedback">
      </div>


      <div class="button-row">

        <button
          id="checkButton"
          onclick="checkAnswer()">

          CHECK

        </button>


        <button
          id="nextButton"
          onclick="nextQuestion()">

          NEXT

        </button>

      </div>


    </div>



    <!-- RESULTS -->

    <div
      id="resultsArea"
      style="display:none;">

      <div
        class="final-score"
        id="finalScore">
      </div>

      <div
        class="final-percent"
        id="finalPercent">
      </div>


      <div class="button-row">

        <button
          id="restartButton"
          onclick="startQuiz()">

          TRY AGAIN

        </button>

      </div>

    </div>


  </div>

</div>



<script>


/* =========================================================
   MASTER QUESTION BANK
   26 FMA SCENARIOS
   ========================================================= */


const questionBank = [


/* =========================
   CLIMB / LEVEL OFF
   ========================= */


{
  scenario:
  "LVL CHG climb — HDG SEL",

  at: "N1",
  roll: "HDG SEL",
  pitch: "MCP SPD"
},


{
  scenario:
  "V/S climb — LNAV",

  at: "MCP SPD",
  roll: "LNAV",
  pitch: "V/S"
},


{
  scenario:
  "VNAV climb, no altitude restrictions — LNAV",

  at: "N1",
  roll: "LNAV",
  pitch: "VNAV SPD"
},


{
  scenario:
  "VNAV climb — just started capturing an FMC altitude restriction — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "ALT ACQ"
},


{
  scenario:
  "VNAV climb — level at FMC altitude restriction, established level — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "VNAV PTH"
},


{
  scenario:
  "VNAV climb — level at MCP altitude due to ATC restriction, established level — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "VNAV ALT"
},


{
  scenario:
  "LVL CHG climb — just started capturing selected altitude — HDG SEL",

  at: "MCP SPD",
  roll: "HDG SEL",
  pitch: "ALT ACQ"
},


{
  scenario:
  "After LVL CHG level-off — established at selected altitude — LNAV",

  at: "MCP SPD",
  roll: "LNAV",
  pitch: "ALT HOLD"
},


{
  scenario:
  "VNAV climb — established at FMC cruise altitude — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "VNAV PTH"
},



/* =========================
   DESCENT / LEVEL OFF
   ========================= */


{
  scenario:
  "LVL CHG descent just initiated — HDG SEL",

  at: "RETARD",
  roll: "HDG SEL",
  pitch: "MCP SPD"
},


{
  scenario:
  "LVL CHG descent, established with thrust at idle — LNAV",

  at: "ARM",
  roll: "LNAV",
  pitch: "MCP SPD"
},


{
  scenario:
  "V/S descent — HDG SEL",

  at: "MCP SPD",
  roll: "HDG SEL",
  pitch: "V/S"
},


{
  scenario:
  "VNAV descent, established on FMC path — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "VNAV PTH"
},


{
  scenario:
  "VNAV descent above path, descent just initiated — LNAV",

  at: "RETARD",
  roll: "LNAV",
  pitch: "VNAV SPD"
},


{
  scenario:
  "VNAV descent above path, established with thrust at idle — LNAV",

  at: "ARM",
  roll: "LNAV",
  pitch: "VNAV SPD"
},


{
  scenario:
  "VNAV descent — just started capturing an FMC altitude restriction — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "ALT ACQ"
},


{
  scenario:
  "VNAV descent — level at FMC altitude restriction, established level — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "VNAV PTH"
},


{
  scenario:
  "VNAV descent — level at MCP altitude due to ATC restriction, established level — LNAV",

  at: "FMC SPD",
  roll: "LNAV",
  pitch: "VNAV ALT"
},



/* =========================
   ALTITUDE CAPTURE
   NON-VNAV
   ========================= */


{
  scenario:
  "V/S climb — just started capturing selected altitude — LNAV",

  at: "MCP SPD",
  roll: "LNAV",
  pitch: "ALT ACQ"
},


{
  scenario:
  "V/S descent — just started capturing selected altitude — HDG SEL",

  at: "MCP SPD",
  roll: "HDG SEL",
  pitch: "ALT ACQ"
},


{
  scenario:
  "After V/S level-off — established at selected altitude — HDG SEL",

  at: "MCP SPD",
  roll: "HDG SEL",
  pitch: "ALT HOLD"
},



/* =========================
   APPROACH
   ========================= */


{
  scenario:
  "ILS — level at cleared altitude, LOC captured, maintaining altitude",

  at: "MCP SPD",
  roll: "VOR/LOC",
  pitch: "ALT HOLD"
},


{
  scenario:
  "ILS — LOC and G/S captured",

  at: "MCP SPD",
  roll: "VOR/LOC",
  pitch: "G/S"
},


{
  scenario:
  "IAN — FAC and G/P captured",

  at: "MCP SPD",
  roll: "FAC",
  pitch: "G/P"
},


{
  scenario:
  "VOR approach — VOR captured, maintaining altitude",

  at: "MCP SPD",
  roll: "VOR/LOC",
  pitch: "ALT HOLD"
},



/* =========================
   GO-AROUND
   ========================= */


{
  scenario:
  "Go-around — TO/GA switches just pushed",

  at: "GA",
  roll: "TO/GA",
  pitch: "TO/GA"
}


];



/* =========================================================
   QUIZ SETTINGS
   ========================================================= */


const NUMBER_OF_QUESTIONS = 10;

let quizQuestions = [];

let currentQuestion = 0;

let score = 0;



/* =========================================================
   SHUFFLE
   Fisher-Yates shuffle
   ========================================================= */


function shuffle(array) {

  const shuffled = [...array];

  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];

  }

  return shuffled;

}



/* =========================================================
   START QUIZ
   ========================================================= */


function startQuiz() {

  /*
     Shuffle all 26 questions
     and take the first 10.
  */

  quizQuestions =
    shuffle(questionBank)
    .slice(
      0,
      NUMBER_OF_QUESTIONS
    );


  currentQuestion = 0;

  score = 0;


  document
    .getElementById("quizArea")
    .style.display = "block";


  document
    .getElementById("resultsArea")
    .style.display = "none";


  document
    .getElementById("restartButton")
    .style.display = "none";


  loadQuestion();

}



/* =========================================================
   LOAD QUESTION
   ========================================================= */


function loadQuestion() {

  const q =
    quizQuestions[currentQuestion];


  document
    .getElementById("scenario")
    .textContent =
    q.scenario;


  document
    .getElementById("questionCounter")
    .textContent =
    `Question ${currentQuestion + 1} / ${quizQuestions.length}`;


  document
    .getElementById("score")
    .textContent =
    `Score: ${score}`;



  /*
     Reset all three FMA selectors
  */

  [
    "at",
    "roll",
    "pitch"
  ].forEach(id => {

    const element =
      document.getElementById(id);

    element.value = "";

    element.disabled = false;

    element.classList.remove(
      "correct",
      "wrong"
    );

  });



  /*
     Clear feedback
  */

  const feedback =
    document.getElementById(
      "feedback"
    );


  feedback.textContent = "";

  feedback.className =
    "feedback";



  /*
     Reset buttons
  */

  document
    .getElementById("checkButton")
    .style.display =
    "inline-block";


  document
    .getElementById("nextButton")
    .style.display =
    "none";

}



/* =========================================================
   CHECK ANSWER
   ========================================================= */


function checkAnswer() {

  const q =
    quizQuestions[currentQuestion];


  const at =
    document.getElementById("at");

  const roll =
    document.getElementById("roll");

  const pitch =
    document.getElementById("pitch");



  /*
     Student must select
     all three modes.
  */

  if (
    !at.value ||
    !roll.value ||
    !pitch.value
  ) {

    document
      .getElementById("feedback")
      .textContent =
      "Select all three FMA modes.";

    return;

  }



  let completelyCorrect = true;



  /*
     AUTOTHROTTLE
  */

  if (
    at.value === q.at
  ) {

    at.classList.add(
      "correct"
    );

  }

  else {

    at.classList.add(
      "wrong"
    );

    completelyCorrect = false;

  }



  /*
     ROLL
  */

  if (
    roll.value === q.roll
  ) {

    roll.classList.add(
      "correct"
    );

  }

  else {

    roll.classList.add(
      "wrong"
    );

    completelyCorrect = false;

  }



  /*
     PITCH
  */

  if (
    pitch.value === q.pitch
  ) {

    pitch.classList.add(
      "correct"
    );

  }

  else {

    pitch.classList.add(
      "wrong"
    );

    completelyCorrect = false;

  }



  /*
     Lock selections
  */

  at.disabled = true;

  roll.disabled = true;

  pitch.disabled = true;



  const feedback =
    document.getElementById(
      "feedback"
    );



  /*
     Score
  */

  if (
    completelyCorrect
  ) {

    score++;


    feedback.textContent =
      "Correct";


    feedback.className =
      "feedback correct-text";

  }

  else {

    feedback.innerHTML =
      `Correct FMA: <strong>${q.at} | ${q.roll} | ${q.pitch}</strong>`;


    feedback.className =
      "feedback wrong-text";

  }



  document
    .getElementById("score")
    .textContent =
    `Score: ${score}`;



  document
    .getElementById("checkButton")
    .style.display =
    "none";


  document
    .getElementById("nextButton")
    .style.display =
    "inline-block";

}



/* =========================================================
   NEXT QUESTION
   ========================================================= */


function nextQuestion() {

  currentQuestion++;


  if (
    currentQuestion >=
    quizQuestions.length
  ) {

    finishQuiz();

  }

  else {

    loadQuestion();

  }

}



/* =========================================================
   FINISH QUIZ
   ========================================================= */


function finishQuiz() {

  document
    .getElementById("quizArea")
    .style.display =
    "none";


  document
    .getElementById("resultsArea")
    .style.display =
    "block";



  const percentage =
    Math.round(
      (
        score /
        quizQuestions.length
      )
      * 100
    );



  document
    .getElementById("finalScore")
    .innerHTML =
    `Your score:<br>${score} / ${quizQuestions.length}`;


  document
    .getElementById("finalPercent")
    .textContent =
    `${percentage}%`;


  document
    .getElementById("restartButton")
    .style.display =
    "inline-block";

}



/* =========================================================
   START AUTOMATICALLY
   ========================================================= */


startQuiz();


</script>


</body>
</html>
