<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>737 FMA Trainer</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f3f3f3;
      color: #222;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 35px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      font-size: 16px;
      color: #666;
    }

    /* QUESTION */

    .scenario {
      max-width: 700px;
      margin: 25px auto 35px;
      min-height: 85px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      font-size: 22px;
      line-height: 1.6;
    }

    .scenario-line {
      display: block;
    }

    .scenario-label {
      font-weight: bold;
      color: #555;
    }

    .scenario-condition {
      font-weight: bold;
      color: #111;
    }

    /* FMA */

    .fma-labels {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
      max-width: 700px;
      margin: 0 auto 4px;
      text-align: center;
      font-size: 13px;
      color: #777;
    }

    .fma {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      max-width: 700px;
      margin: auto;
      background: #222;
      padding: 3px;
    }

    .fma select {
      width: 100%;
      height: 70px;
      background: #4d4d4d;
      border: none;

      color: #00ff4c;

      font-size: 19px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }

    .fma select:focus {
      outline: 2px solid #00ff4c;
    }

    /* FMA COLORS */

    .mode-green {
      color: #00ff4c !important;
    }

    .mode-white {
      color: #ffffff !important;
    }

    .mode-amber {
      color: #ffbf00 !important;
    }

    /* ANSWER BACKGROUNDS */

    .correct {
      background: #215d31 !important;
    }

    .wrong {
      background: #772727 !important;
    }

    /* BUTTONS */

    .button-row {
      text-align: center;
      margin-top: 30px;
    }

    button {
      padding: 14px 32px;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    #checkButton {
      background: #222;
      color: white;
    }

    #nextButton {
      background: #3877d6;
      color: white;
      display: none;
    }

    #restartButton {
      background: #222;
      color: white;
      display: none;
    }

    /* FEEDBACK */

    .feedback {
      min-height: 35px;
      text-align: center;
      margin-top: 22px;
      font-size: 18px;
      font-weight: bold;
    }

    .correct-text {
      color: #187b35;
    }

    .wrong-text {
      color: #b02727;
    }

    .answer-fma {
      margin-top: 8px;
      font-size: 20px;
    }

    .answer-green {
      color: #00a63c;
    }

    .answer-white {
      color: #777;
    }

    .answer-amber {
      color: #c88900;
    }

    /* FINAL SCORE */

    .final-score {
      text-align: center;
      font-size: 38px;
      font-weight: bold;
      margin: 40px 0 15px;
    }

    .final-percent {
      text-align: center;
      font-size: 20px;
      color: #666;
      margin-bottom: 30px;
    }

    @media (max-width: 600px) {

      .container {
        padding: 15px 10px;
      }

      .card {
        padding: 20px 10px;
      }

      .scenario {
        font-size: 18px;
        line-height: 1.7;
      }

      .fma select {
        font-size: 13px;
        height: 65px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>737 FMA Trainer</h1>

  <div class="subtitle">
    Autoflight Mode Practice
  </div>

  <div class="card">

    <div id="quizArea">

      <div class="top-row">
        <div id="questionCounter">Question 1 / 10</div>
        <div id="score">Score: 0</div>
      </div>

      <div class="scenario" id="scenario"></div>

      <div class="fma-labels">
        <div>AUTOTHROTTLE</div>
        <div>ROLL</div>
        <div>PITCH</div>
      </div>

      <div class="fma">

        <!-- AUTOTHROTTLE -->

        <select id="at" onchange="updateModeColor(this)">
          <option value="">---</option>
          <option>N1</option>
          <option>MCP SPD</option>
          <option>FMC SPD</option>
          <option>ARM</option>
          <option>THR HLD</option>
          <option>RETARD</option>
          <option>GA</option>
        </select>

        <!-- ROLL -->

        <select id="roll" onchange="updateModeColor(this)">
          <option value="">---</option>
          <option>BLANK</option>
          <option>HDG SEL</option>
          <option>LNAV</option>
          <option>VOR/LOC</option>
          <option>FAC</option>
          <option>TO/GA</option>
          <option>ROLLOUT</option>
          <option>CWS R</option>
        </select>

        <!-- PITCH -->

        <select id="pitch" onchange="updateModeColor(this)">
          <option value="">---</option>
          <option>MCP SPD</option>
          <option>V/S</option>
          <option>ALT ACQ</option>
          <option>ALT HOLD</option>
          <option>VNAV SPD</option>
          <option>VNAV PTH</option>
          <option>VNAV ALT</option>
          <option>G/S</option>
          <option>G/P</option>
          <option>TO/GA</option>
          <option>FLARE</option>
          <option>CWS P</option>
        </select>

      </div>

      <div class="feedback" id="feedback"></div>

      <div class="button-row">

        <button id="checkButton" onclick="checkAnswer()">
          CHECK
        </button>

        <button id="nextButton" onclick="nextQuestion()">
          NEXT
        </button>

      </div>

    </div>

    <div id="resultsArea" style="display:none;">

      <div class="final-score" id="finalScore"></div>

      <div class="final-percent" id="finalPercent"></div>

      <div class="button-row">

        <button id="restartButton" onclick="startQuiz()">
          TRY AGAIN
        </button>

      </div>

    </div>

  </div>

</div>

<script>

/* =========================================================
   MASTER QUESTION BANK
   ========================================================= */

const questionBank = [

  /* =====================================================
     CLIMB / LEVEL OFF
     ===================================================== */

  {
    vertical: "LVL CHG climb",
    horizontal: "HDG SEL",
    at: "N1",
    roll: "HDG SEL",
    pitch: "MCP SPD"
  },

  {
    vertical: "V/S climb",
    horizontal: "LNAV",
    at: "MCP SPD",
    roll: "LNAV",
    pitch: "V/S"
  },

  {
    vertical: "VNAV climb — no altitude restrictions",
    horizontal: "LNAV",
    at: "N1",
    roll: "LNAV",
    pitch: "VNAV SPD"
  },

  {
    vertical: "VNAV climb — just started capturing an FMC altitude restriction",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "ALT ACQ"
  },

  {
    vertical: "VNAV climb — level at FMC altitude restriction, established level",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "VNAV PTH"
  },

  {
    vertical: "VNAV climb — level at MCP altitude due to ATC restriction, established level",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "VNAV ALT"
  },

  {
    vertical: "LVL CHG climb — just started capturing selected altitude",
    horizontal: "HDG SEL",
    at: "MCP SPD",
    roll: "HDG SEL",
    pitch: "ALT ACQ"
  },

  {
    vertical: "After LVL CHG level-off — established at selected altitude",
    horizontal: "LNAV",
    at: "MCP SPD",
    roll: "LNAV",
    pitch: "ALT HOLD"
  },

  {
    vertical: "VNAV climb — established at FMC cruise altitude",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "VNAV PTH"
  },


  /* =====================================================
     DESCENT / LEVEL OFF
     ===================================================== */

  {
    vertical: "LVL CHG descent — just initiated",
    horizontal: "HDG SEL",
    at: "RETARD",
    roll: "HDG SEL",
    pitch: "MCP SPD"
  },

  {
    vertical: "LVL CHG descent — established with thrust at idle",
    horizontal: "LNAV",
    at: "ARM",
    roll: "LNAV",
    pitch: "MCP SPD"
  },

  {
    vertical: "V/S descent",
    horizontal: "HDG SEL",
    at: "MCP SPD",
    roll: "HDG SEL",
    pitch: "V/S"
  },

  {
    vertical: "VNAV descent — established on FMC path",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "VNAV PTH"
  },

  {
    vertical: "VNAV descent above path — descent just initiated",
    horizontal: "LNAV",
    at: "RETARD",
    roll: "LNAV",
    pitch: "VNAV SPD"
  },

  {
    vertical: "VNAV descent above path — established with thrust at idle",
    horizontal: "LNAV",
    at: "ARM",
    roll: "LNAV",
    pitch: "VNAV SPD"
  },

  {
    vertical: "VNAV descent — just started capturing an FMC altitude restriction",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "ALT ACQ"
  },

  {
    vertical: "VNAV descent — level at FMC altitude restriction, established level",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "VNAV PTH"
  },

  {
    vertical: "VNAV descent — level at MCP altitude due to ATC restriction, established level",
    horizontal: "LNAV",
    at: "FMC SPD",
    roll: "LNAV",
    pitch: "VNAV ALT"
  },


  /* =====================================================
     ALTITUDE CAPTURE — NON-VNAV
     ===================================================== */

  {
    vertical: "V/S climb — just started capturing selected altitude",
    horizontal: "LNAV",
    at: "MCP SPD",
    roll: "LNAV",
    pitch: "ALT ACQ"
  },

  {
    vertical: "V/S descent — just started capturing selected altitude",
    horizontal: "HDG SEL",
    at: "MCP SPD",
    roll: "HDG SEL",
    pitch: "ALT ACQ"
  },

  {
    vertical: "After V/S level-off — established at selected altitude",
    horizontal: "HDG SEL",
    at: "MCP SPD",
    roll: "HDG SEL",
    pitch: "ALT HOLD"
  },


  /* =====================================================
     APPROACH
     ===================================================== */

  {
    vertical: "Maintaining cleared altitude",
    horizontal: "ILS — LOC captured",
    at: "MCP SPD",
    roll: "VOR/LOC",
    pitch: "ALT HOLD"
  },

  {
    vertical: "ILS — G/S captured",
    horizontal: "LOC captured",
    at: "MCP SPD",
    roll: "VOR/LOC",
    pitch: "G/S"
  },

  {
    vertical: "IAN — G/P captured",
    horizontal: "FAC captured",
    at: "MCP SPD",
    roll: "FAC",
    pitch: "G/P"
  },

  {
    vertical: "Maintaining altitude",
    horizontal: "VOR captured",
    at: "MCP SPD",
    roll: "VOR/LOC",
    pitch: "ALT HOLD"
  },


  /* =====================================================
     GO-AROUND
     ===================================================== */

  {
    vertical: "Go-around — TO/GA switches just pushed",
    horizontal: "TO/GA",
    at: "GA",
    roll: "TO/GA",
    pitch: "TO/GA"
  },


  /* =====================================================
     TAKEOFF
     ===================================================== */

  {
    vertical: "Takeoff — TO/GA just pushed, beginning takeoff roll",
    horizontal: "LNAV armed",
    at: "N1",
    roll: "BLANK",
    pitch: "TO/GA"
  },

  {
    vertical: "Takeoff roll — passing 84 kt",
    horizontal: "LNAV armed",
    at: "THR HLD",
    roll: "BLANK",
    pitch: "TO/GA"
  },

  {
    vertical: "After liftoff — below LNAV engagement altitude",
    horizontal: "LNAV armed",
    at: "THR HLD",
    roll: "BLANK",
    pitch: "TO/GA"
  },

  {
    vertical: "Initial climb — below 800 ft RA",
    horizontal: "LNAV engaged",
    at: "THR HLD",
    roll: "LNAV",
    pitch: "TO/GA"
  },

  {
    vertical: "Initial climb — above 800 ft RA, before climb thrust engages",
    horizontal: "LNAV engaged",
    at: "ARM",
    roll: "LNAV",
    pitch: "TO/GA"
  },

  {
    vertical: "Climb — climb thrust selected, still in TO/GA pitch mode",
    horizontal: "LNAV engaged",
    at: "N1",
    roll: "LNAV",
    pitch: "TO/GA"
  },

  {
    vertical: "Climb — VNAV engaged after takeoff",
    horizontal: "LNAV engaged",
    at: "N1",
    roll: "LNAV",
    pitch: "VNAV SPD"
  }

];


/* =========================================================
   SETTINGS
   ========================================================= */

const NUMBER_OF_QUESTIONS = 10;

let quizQuestions = [];
let currentQuestion = 0;
let score = 0;


/* =========================================================
   FMA COLOR LOGIC
   ========================================================= */

function getModeColorClass(mode) {

  /* WHITE */

  if (
    mode === "ARM" ||
    mode === "THR HLD"
  ) {
    return "mode-white";
  }


  /* AMBER */

  if (
    mode === "CWS R" ||
    mode === "CWS P"
  ) {
    return "mode-amber";
  }


  /* GREEN */

  return "mode-green";
}


function updateModeColor(element) {

  element.classList.remove(
    "mode-green",
    "mode-white",
    "mode-amber"
  );

  if (element.value === "") {
    return;
  }

  element.classList.add(
    getModeColorClass(element.value)
  );
}


/* =========================================================
   CORRECT ANSWER COLORS
   ========================================================= */

function answerModeHTML(mode) {

  const colorClass =
    getModeColorClass(mode);

  let answerClass =
    "answer-green";

  if (colorClass === "mode-white") {
    answerClass = "answer-white";
  }

  if (colorClass === "mode-amber") {
    answerClass = "answer-amber";
  }

  return `<span class="${answerClass}">${mode}</span>`;
}


/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {

  const shuffled = [...array];

  for (
    let i = shuffled.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [
      shuffled[i],
      shuffled[j]
    ] =
    [
      shuffled[j],
      shuffled[i]
    ];
  }

  return shuffled;
}


/* =========================================================
   START QUIZ
   ========================================================= */

function startQuiz() {

  quizQuestions =
    shuffle(questionBank)
      .slice(
        0,
        NUMBER_OF_QUESTIONS
      );

  currentQuestion = 0;
  score = 0;

  document
    .getElementById("quizArea")
    .style.display = "block";

  document
    .getElementById("resultsArea")
    .style.display = "none";

  document
    .getElementById("restartButton")
    .style.display = "none";

  loadQuestion();
}


/* =========================================================
   LOAD QUESTION
   ========================================================= */

function loadQuestion() {

  const q =
    quizQuestions[currentQuestion];


  /*
    NEW QUESTION FORMAT:

    VERTICAL: condition
    HORIZONTAL: condition
  */

  document
    .getElementById("scenario")
    .innerHTML =
    `
      <div class="scenario-line">
        <span class="scenario-label">VERTICAL:</span>
        <span class="scenario-condition">${q.vertical}</span>
      </div>

      <div class="scenario-line">
        <span class="scenario-label">HORIZONTAL:</span>
        <span class="scenario-condition">${q.horizontal}</span>
      </div>
    `;


  document
    .getElementById("questionCounter")
    .textContent =
    `Question ${currentQuestion + 1} / ${quizQuestions.length}`;


  document
    .getElementById("score")
    .textContent =
    `Score: ${score}`;


  [
    "at",
    "roll",
    "pitch"
  ].forEach(id => {

    const element =
      document.getElementById(id);

    element.value = "";
    element.disabled = false;

    element.classList.remove(
      "correct",
      "wrong",
      "mode-green",
      "mode-white",
      "mode-amber"
    );
  });


  const feedback =
    document.getElementById("feedback");

  feedback.textContent = "";
  feedback.className = "feedback";


  document
    .getElementById("checkButton")
    .style.display = "inline-block";

  document
    .getElementById("nextButton")
    .style.display = "none";
}


/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer() {

  const q =
    quizQuestions[currentQuestion];

  const at =
    document.getElementById("at");

  const roll =
    document.getElementById("roll");

  const pitch =
    document.getElementById("pitch");


  if (
    !at.value ||
    !roll.value ||
    !pitch.value
  ) {

    document
      .getElementById("feedback")
      .textContent =
      "Select all three FMA modes.";

    return;
  }


  let completelyCorrect = true;


  if (at.value === q.at) {
    at.classList.add("correct");
  } else {
    at.classList.add("wrong");
    completelyCorrect = false;
  }


  if (roll.value === q.roll) {
    roll.classList.add("correct");
  } else {
    roll.classList.add("wrong");
    completelyCorrect = false;
  }


  if (pitch.value === q.pitch) {
    pitch.classList.add("correct");
  } else {
    pitch.classList.add("wrong");
    completelyCorrect = false;
  }


  at.disabled = true;
  roll.disabled = true;
  pitch.disabled = true;


  const feedback =
    document.getElementById("feedback");


  if (completelyCorrect) {

    score++;

    feedback.textContent =
      "Correct";

    feedback.className =
      "feedback correct-text";

  } else {

    feedback.innerHTML =
      `
        Correct FMA:
        <div class="answer-fma">
          ${answerModeHTML(q.at)}
          |
          ${answerModeHTML(q.roll)}
          |
          ${answerModeHTML(q.pitch)}
        </div>
      `;

    feedback.className =
      "feedback wrong-text";
  }


  document
    .getElementById("score")
    .textContent =
    `Score: ${score}`;


  document
    .getElementById("checkButton")
    .style.display = "none";

  document
    .getElementById("nextButton")
    .style.display = "inline-block";
}


/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

  currentQuestion++;

  if (
    currentQuestion >=
    quizQuestions.length
  ) {

    finishQuiz();

  } else {

    loadQuestion();
  }
}


/* =========================================================
   FINISH QUIZ
   ========================================================= */

function finishQuiz() {

  document
    .getElementById("quizArea")
    .style.display = "none";

  document
    .getElementById("resultsArea")
    .style.display = "block";


  const percentage =
    Math.round(
      (
        score /
        quizQuestions.length
      ) * 100
    );


  document
    .getElementById("finalScore")
    .innerHTML =
    `Your score:<br>${score} / ${quizQuestions.length}`;


  document
    .getElementById("finalPercent")
    .textContent =
    `${percentage}%`;


  document
    .getElementById("restartButton")
    .style.display = "inline-block";
}


/* =========================================================
   START
   ========================================================= */

startQuiz();

</script>

</body>
</html>
