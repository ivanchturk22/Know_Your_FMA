<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>737 FMA Trainer</title>

<style>

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #222;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}


/* =========================
   MODE MENUS
   ========================= */

.mode-select {
    text-align: center;
    margin-bottom: 30px;
}

.mode-select h2 {
    margin-bottom: 10px;
}

.mode-select p {
    color: #666;
    line-height: 1.6;
    margin-bottom: 20px;
}

.mode-button {
    padding: 14px 28px;
    margin: 8px;
    border: none;
    border-radius: 7px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.quiz-mode-button {
    background: #222;
    color: white;
}

.practice-mode-button {
    background: #3877d6;
    color: white;
}

.random-button {
    background: #3877d6;
    color: white;
}

.stage-button {
    background: #187b35;
    color: white;
}

.back-button {
    background: #777;
    color: white;
}


/* =========================
   TOP ROW
   ========================= */

.top-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 16px;
    color: #666;
}

.stage-name {
    text-align: center;
    min-height: 24px;
    margin-bottom: 15px;
    font-size: 15px;
    font-weight: bold;
    color: #3877d6;
    letter-spacing: 0.5px;
}


/* =========================
   QUESTION
   ========================= */

.scenario {
    max-width: 700px;
    margin: 20px auto 35px;
    min-height: 85px;

    display: flex;
    flex-direction: column;
    justify-content: center;

    font-size: 22px;
    line-height: 1.6;
}

.scenario-line {
    display: block;
}

.scenario-label {
    font-weight: bold;
    color: #555;
}

.scenario-condition {
    font-weight: bold;
    color: #111;
}


/* =========================
   FMA
   ========================= */

.fma-labels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 3px;

    max-width: 700px;
    margin: 0 auto 4px;

    text-align: center;

    font-size: 13px;
    color: #777;
}

.fma {
    display: grid;
    grid-template-columns: repeat(3, 1fr);

    gap: 2px;

    max-width: 700px;
    margin: auto;

    background: #222;
    padding: 3px;
}

.fma select {
    width: 100%;
    height: 70px;

    background: #4d4d4d;

    border: none;

    color: #00ff4c;

    font-size: 19px;
    font-weight: bold;

    text-align: center;

    cursor: pointer;
}

.fma select:focus {
    outline: 2px solid #00ff4c;
}


/* =========================
   FMA COLORS
   ========================= */

.mode-green {
    color: #00ff4c !important;
}

.mode-white {
    color: #ffffff !important;
}

.mode-amber {
    color: #ffbf00 !important;
}


/* =========================
   CORRECT / WRONG
   ========================= */

.correct {
    background: #215d31 !important;
}

.wrong {
    background: #772727 !important;
}


/* =========================
   BUTTONS
   ========================= */

.button-row {
    text-align: center;
    margin-top: 30px;
}

button {
    padding: 14px 32px;

    border: none;
    border-radius: 7px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    margin: 5px;
}

#checkButton {
    background: #222;
    color: white;
}

#nextButton {
    background: #3877d6;
    color: white;
    display: none;
}

#restartButton,
#menuButton {
    background: #222;
    color: white;
    display: none;
}


/* =========================
   FEEDBACK
   ========================= */

.feedback {
    min-height: 35px;

    text-align: center;

    margin-top: 22px;

    font-size: 18px;
    font-weight: bold;
}

.correct-text {
    color: #187b35;
}

.wrong-text {
    color: #b02727;
}

.answer-fma {
    margin-top: 8px;
    font-size: 20px;
}

.answer-green {
    color: #00a63c;
}

.answer-white {
    color: #777;
}

.answer-amber {
    color: #c88900;
}

.answer-blank {
    color: #777;
}


/* =========================
   RESULTS
   ========================= */

.final-score {
    text-align: center;

    font-size: 38px;
    font-weight: bold;

    margin: 40px 0 15px;
}

.final-percent {
    text-align: center;

    font-size: 20px;

    color: #666;

    margin-bottom: 30px;
}

.practice-finished {
    text-align: center;

    font-size: 32px;
    font-weight: bold;

    margin: 40px 0 20px;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .container {
        padding: 15px 10px;
    }

    .card {
        padding: 20px 10px;
    }

    .scenario {
        font-size: 18px;
        line-height: 1.7;
    }

    .fma select {
        font-size: 13px;
        height: 65px;
    }

    .mode-button {
        width: 90%;
    }
}

</style>

</head>

/* =========================================================
   VARIABLES
   ========================================================= */

const QUIZ_QUESTION_COUNT = 10;

let currentMode = null;

let activeQuestions = [];

let currentQuestion = 0;

let score = 0;



/* =========================================================
   FMA COLORS
   ========================================================= */

function getModeColorClass(mode) {

    if (
        mode === "ARM" ||
        mode === "THR HLD"
    ) {

        return "mode-white";
    }


    if (
        mode === "CWS R" ||
        mode === "CWS P"
    ) {

        return "mode-amber";
    }


    return "mode-green";
}



function updateModeColor(element) {

    element.classList.remove(
        "mode-green",
        "mode-white",
        "mode-amber"
    );


    if (element.value === "") {

        return;
    }


    element.classList.add(
        getModeColorClass(
            element.value
        )
    );
}



/* =========================================================
   ANSWER DISPLAY
   ========================================================= */

function answerModeHTML(mode) {

    if (mode === "") {

        return `
        <span class="answer-blank">
        ---
        </span>
        `;
    }


    const colorClass =
        getModeColorClass(mode);


    let answerClass =
        "answer-green";


    if (
        colorClass ===
        "mode-white"
    ) {

        answerClass =
            "answer-white";
    }


    if (
        colorClass ===
        "mode-amber"
    ) {

        answerClass =
            "answer-amber";
    }


    return `
    <span class="${answerClass}">
    ${mode}
    </span>
    `;
}



/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {

    const shuffled =
        [...array];


    for (
        let i =
        shuffled.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];
    }


    return shuffled;
}



/* =========================================================
   MAIN MENU
   ========================================================= */

function showMainMenu() {

    currentMode = null;


    document
        .getElementById(
            "quizArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "resultsArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "practiceMenu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "modeMenu"
        )
        .style.display =
        "block";
}



/* =========================================================
   PRACTICE MENU
   ========================================================= */

function showPracticeMenu() {

            "modeMenu"

        "none";


    document
        .getElementById(
            "practiceMenu"
        )
        .style.display =
        "block";
}



/* =========================================================
   QUIZ MODE
   ========================================================= */

function startQuizMode() {

    currentMode =
        "quiz";


    activeQuestions =
        shuffle(
            questionBank
        )
        .slice(
            0,
            QUIZ_QUESTION_COUNT
        );


    startSession();
}



/* =========================================================
   RANDOM PRACTICE
   ========================================================= */

function startRandomPractice() {

    currentMode =
        "practice-random";


    activeQuestions =
        shuffle(
            questionBank
        );


    startSession();
}



/* =========================================================
   STAGE-BY-STAGE PRACTICE
   ========================================================= */

function startStagePractice() {

    currentMode =
        "practice-stage";


    activeQuestions = [];


    /*
      Go through stages in the specified order.

      Questions within each stage stay
      in their logical database order.
    */

    stageOrder.forEach(
        stage => {

            const stageQuestions =
                questionBank.filter(
                    question =>
                    question.stage === stage
                );


            activeQuestions.push(
                ...stageQuestions
            );
        }
    );


    startSession();
}



/* =========================================================
   START SESSION
   ========================================================= */

function startSession() {

    currentQuestion = 0;

    score = 0;


    document
        .getElementById(
            "modeMenu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "practiceMenu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "resultsArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quizArea"
        )
        .style.display =
        "block";


    loadQuestion();
}



/* =========================================================
   LOAD QUESTION
   ========================================================= */

function loadQuestion() {

    const q =
        activeQuestions[
            currentQuestion
        ];


    /* QUESTION TEXT */

    document
        .getElementById(
            "scenario"
        )
        .innerHTML =
        `

        <div class="scenario-line">

            <span class="scenario-label">
            VERTICAL:
            </span>

            <span class="scenario-condition">
            ${q.vertical}
            </span>

        </div>


        <div class="scenario-line">

            <span class="scenario-label">
            HORIZONTAL:
            </span>

            <span class="scenario-condition">
            ${q.horizontal}
            </span>

        </div>

        `;


    /* QUESTION COUNTER */

    document
        .getElementById(
            "questionCounter"
        )
        .textContent =
        `Question ${currentQuestion + 1} / ${activeQuestions.length}`;



    /* SCORE / MODE */

    if (
        currentMode === "quiz"
    ) {

        document
            .getElementById(
                "score"
            )
            .textContent =
            `Score: ${score}`;

    }

    else if (
        currentMode ===
        "practice-stage"
    ) {

        document
            .getElementById(
                "score"
            )
            .textContent =
            "Stage Practice";

    }

    else {

        document
            .getElementById(
                "score"
            )
            .textContent =
            "Random Practice";
    }



    /* STAGE NAME */

    const stageName =
        document.getElementById(
            "stageName"
        );


    if (
        currentMode ===
        "practice-stage"
    ) {

        stageName.textContent =
            q.stage;

    }

    else {

        stageName.textContent =
            "";
    }



    /* RESET FMA */

    [
        "at",
        "roll",
        "pitch"
    ].forEach(
        id => {

            const element =
                document
                .getElementById(id);


            element.value = "";

            element.disabled =
                false;


            element
                .classList
                .remove(
                    "correct",
                    "wrong",
                    "mode-green",
                    "mode-white",
                    "mode-amber"
                );
        }
    );



    /* RESET FEEDBACK */

    const feedback =
        document
        .getElementById(
            "feedback"
        );


    feedback.textContent =
        "";

    feedback.className =
        "feedback";



    document
        .getElementById(
            "checkButton"
        )
        .style.display =
        "inline-block";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "none";
}



/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer() {

    const q =
        activeQuestions[
            currentQuestion
        ];


    const at =
        document
        .getElementById(
            "at"
        );


    const roll =
        document
        .getElementById(
            "roll"
        );


    const pitch =
        document
        .getElementById(
            "pitch"
        );



    /*
      --- is a valid ROLL answer
      when q.roll is empty.

      A/T and pitch must always
      have a selected mode.
    */

    if (
        !at.value ||
        !pitch.value ||
        (
            q.roll !== "" &&
            !roll.value
        )
    ) {

        document
            .getElementById(
                "feedback"
            )
            .textContent =
            "Select all required FMA modes.";


        return;
    }



    let completelyCorrect =
        true;



    /* AUTOTHROTTLE */

    if (
        at.value === q.at
    ) {

        at.classList.add(
            "correct"
        );

    }

    else {

        at.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    /* ROLL */

    if (
        roll.value === q.roll
    ) {

        roll.classList.add(
            "correct"
        );

    }

    else {

        roll.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    /* PITCH */

    if (
        pitch.value === q.pitch
    ) {

        pitch.classList.add(
            "correct"
        );

    }

    else {

        pitch.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    /* LOCK */

    at.disabled =
        true;

    roll.disabled =
        true;

    pitch.disabled =
        true;



    const feedback =
        document
        .getElementById(
            "feedback"
        );



    if (
        completelyCorrect
    ) {


        if (
            currentMode ===
            "quiz"
        ) {

            score++;
        }


        feedback.textContent =
            "Correct";


        feedback.className =
            "feedback correct-text";

    }

    else {


        feedback.innerHTML =
        `

        Correct FMA:

        <div class="answer-fma">

            ${answerModeHTML(q.at)}

            |

            ${answerModeHTML(q.roll)}

            |

            ${answerModeHTML(q.pitch)}

        </div>

        `;


        feedback.className =
            "feedback wrong-text";
    }



    if (
        currentMode ===
        "quiz"
    ) {

        document
            .getElementById(
                "score"
            )
            .textContent =
            `Score: ${score}`;
    }



    document
        .getElementById(
            "checkButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "inline-block";
}



/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        activeQuestions.length
    ) {

        finishSession();

    }

    else {

        loadQuestion();
    }
}



/* =========================================================
   FINISH SESSION
   ========================================================= */

function finishSession() {

    document
        .getElementById(
            "quizArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "resultsArea"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "restartButton"
        )
        .style.display =
        "inline-block";


    document
        .getElementById(
            "menuButton"
        )
        .style.display =
        "inline-block";



    if (
        currentMode ===
        "quiz"
    ) {


        const percentage =
            Math.round(
                (
                    score /
                    activeQuestions.length
                )
                * 100
            );


        document
            .getElementById(
                "practiceFinished"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "finalScore"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "finalPercent"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "finalScore"
            )
            .innerHTML =
            `Your score:<br>${score} / ${activeQuestions.length}`;


        document
            .getElementById(
                "finalPercent"
            )
            .textContent =
            `${percentage}%`;

    }

    else {


        document
            .getElementById(
                "finalScore"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "finalPercent"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "practiceFinished"
            )
            .style.display =
            "block";
    }
}



/* =========================================================
   RESTART CURRENT MODE
   ========================================================= */

function restartCurrentMode() {

    if (
        currentMode ===
        "quiz"
    ) {

        startQuizMode();
    }


    else if (
        currentMode ===
        "practice-random"
    ) {

        startRandomPractice();
    }


    else {

        startStagePractice();
    }
}



/* =========================================================
   START
   ========================================================= */

showMainMenu();

</script>
