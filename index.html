<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>737 FMA Trainer</title>

<style>

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f3f3;
    color: #222;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 30px 20px;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #666;
    margin-bottom: 35px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}


/* =========================
   MODE MENUS
   ========================= */

.mode-select {
    text-align: center;
    margin-bottom: 30px;
}

.mode-select h2 {
    margin-bottom: 10px;
}

.mode-select p {
    color: #666;
    line-height: 1.6;
    margin-bottom: 20px;
}

.mode-button {
    padding: 14px 28px;
    margin: 8px;
    border: none;
    border-radius: 7px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.quiz-mode-button {
    background: #222;
    color: white;
}

.practice-mode-button {
    background: #3877d6;
    color: white;
}

.random-button {
    background: #3877d6;
    color: white;
}

.stage-button {
    background: #187b35;
    color: white;
}

.back-button {
    background: #777;
    color: white;
}


/* =========================
   TOP ROW
   ========================= */

.top-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    font-size: 16px;
    color: #666;
}

.stage-name {
    text-align: center;
    min-height: 24px;
    margin-bottom: 15px;
    font-size: 15px;
    font-weight: bold;
    color: #3877d6;
    letter-spacing: 0.5px;
}


/* =========================
   PFD STYLE AREA
   ========================= */

.pfd-area {
    max-width: 760px;
    margin: 15px auto 0;
    border-radius: 10px;
    overflow: hidden;
    border: 4px solid #222;

    box-shadow:
        inset 0 0 25px rgba(0,0,0,0.25),
        0 4px 12px rgba(0,0,0,0.15);
}


/* =========================
   BLUE SKY
   ========================= */

.pfd-sky {
    min-height: 260px;
    background: #4f91bd;
    padding: 28px 28px 35px;
    box-sizing: border-box;
}


/* =========================
   FMA LABELS
   ========================= */

.fma-labels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    max-width: 700px;
    margin: 0 auto 5px;
    text-align: center;
    font-size: 13px;
    font-weight: bold;
    color: white;

    text-shadow:
        0 1px 2px rgba(0,0,0,0.8);
}


/* =========================
   FMA BOXES
   ========================= */

.fma {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
    max-width: 700px;
    margin: 0 auto;
    background: rgba(0,0,0,0.85);
    padding: 4px;
    box-sizing: border-box;
}

.fma select {
    width: 100%;
    height: 70px;
    background: #333;
    border: 1px solid #777;
    color: #00ff4c;
    font-size: 19px;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
}

.fma select:focus {
    outline: 2px solid #00ff4c;
}


/* =========================
   AFDS BELOW ROLL
   ========================= */

.afds-label {
    grid-column: 2;
    text-align: center;
    color: white;
    font-size: 13px;
    font-weight: bold;
    padding-top: 12px;

    text-shadow:
        0 1px 2px rgba(0,0,0,0.8);
}

#afds {
    grid-column: 2;
}


/* =========================
   BROWN GROUND
   ========================= */

.pfd-ground {
    min-height: 260px;
    background: #8b5d3b;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 35px 30px;
    box-sizing: border-box;

    border-top: 3px solid white;
}


/* =========================
   QUESTION WHITE BOX
   ========================= */

.question-box {
    width: 100%;
    max-width: 650px;

    background: white;
    color: #111;

    padding: 24px 28px;
    border-radius: 9px;
    box-sizing: border-box;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.25);

    font-size: 20px;
    line-height: 1.7;
}

.scenario-line {
    display: block;
}

.scenario-label {
    font-weight: bold;
    color: #555;
}

.scenario-condition {
    font-weight: bold;
    color: #111;
}


/* =========================
   FMA COLORS
   ========================= */

.mode-green {
    color: #00ff4c !important;
}

.mode-white {
    color: #ffffff !important;
}

.mode-amber {
    color: #ffbf00 !important;
}


/* =========================
   CORRECT / WRONG
   ========================= */

.correct {
    background: #215d31 !important;
}

.wrong {
    background: #772727 !important;
}


/* =========================
   BUTTONS
   ========================= */

.button-row {
    text-align: center;
    margin-top: 30px;
}

button {
    padding: 14px 32px;

    border: none;
    border-radius: 7px;

    font-size: 17px;
    font-weight: bold;

    cursor: pointer;

    margin: 5px;
}

#checkButton {
    background: #222;
    color: white;
}

#nextButton {
    background: #3877d6;
    color: white;
    display: none;
}

#restartButton,
#menuButton {
    background: #222;
    color: white;
    display: none;
}


/* =========================
   FEEDBACK
   ========================= */

.feedback {
    min-height: 35px;
    text-align: center;
    margin-top: 22px;
    font-size: 18px;
    font-weight: bold;
}

.correct-text {
    color: #187b35;
}

.wrong-text {
    color: #b02727;
}

.answer-fma {
    margin-top: 8px;
    font-size: 20px;
}

.answer-green {
    color: #00a63c;
}

.answer-white {
    color: #777;
}

.answer-amber {
    color: #c88900;
}

.answer-blank {
    color: #777;
}


/* =========================
   RESULTS
   ========================= */

.final-score {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    margin: 40px 0 15px;
}

.final-percent {
    text-align: center;
    font-size: 20px;
    color: #666;
    margin-bottom: 30px;
}

.practice-finished {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    margin: 40px 0 20px;
}


/* =========================
   MOBILE
   ========================= */

@media (max-width: 600px) {

    .container {
        padding: 15px 10px;
    }

    .card {
        padding: 20px 10px;
    }

    .pfd-sky {
        min-height: 220px;
        padding: 20px 8px 25px;
    }

    .pfd-ground {
        min-height: 220px;

    }

    .question-box {
        font-size: 17px;
        padding: 18px;
    }

    .fma select {
        font-size: 13px;
        height: 62px;
    }

    .fma-labels {
        font-size: 11px;
    }

    .mode-button {
        width: 90%;
    }
}

</style>

</head>

                <div>ROLL</div>

                <div>PITCH</div>

            </div>

                    <option>ARM</option>

                    <option>THR HLD</option>

                    <option>RETARD</option>

                    <option>GA</option>

                </select>



                <!-- ROLL -->

                    id="roll"

                    <option>HDG SEL</option>

                    <option>LNAV</option>

                    <option>VOR/LOC</option>

                    <option>FAC</option>

                    <option>ROLLOUT</option>

                    <option>CWS R</option>

                </select>



                <!-- PITCH -->

                <select
                    id="pitch"
                    onchange="updateModeColor(this)">

                    <option value="">---</option>

                    <option>MCP SPD</option>

                    <option>V/S</option>

                    <option>ALT ACQ</option>

                    <option>ALT HOLD</option>

                    <option>VNAV SPD</option>

                    <option>VNAV PTH</option>

                    <option>VNAV ALT</option>

                    <option>G/S</option>

                    <option>G/P</option>

                    <option>TO/GA</option>

                    <option>FLARE</option>

                    <option>CWS P</option>

                </select>



                <!-- AFDS BELOW ROLL -->

                <div class="afds-label">
                    AFDS
                </div>


                <select
                    id="afds"
                    onchange="updateModeColor(this)">

                    <option value="">---</option>

                    <option>FD</option>

                    <option>CMD</option>

                    <option>SINGLE CH</option>

                    <option>LAND 3</option>

                </select>


            </div>

        </div>



        <!-- BROWN GROUND -->

        <div class="pfd-ground">


            <div
                class="question-box"
                id="scenario">
            </div>


        </div>


    </div>



    <div
        class="feedback"
        id="feedback">
    </div>


    <div class="button-row">

        <button
            id="checkButton"
            onclick="checkAnswer()">

            CHECK

        </button>

        <button
            id="nextButton"
            onclick="nextQuestion()">

            NEXT

        </button>

    </div>

</div>



<!-- RESULTS -->

<div
    id="resultsArea"
    style="display:none;">

        id="finalScore">
    </div>

    </div>

        Practice Complete

            TRY AGAIN

        </button>

        <button
            id="menuButton"
            onclick="showMainMenu()">

            MODE MENU

        </button>

    </div>

</div>

</div>

/* =========================================================
   VARIABLES
   ========================================================= */

const QUIZ_QUESTION_COUNT = 10;

let currentMode = null;

let activeQuestions = [];

let currentQuestion = 0;

let score = 0;



/* =========================================================
   FMA COLORS
   ========================================================= */

function getModeColorClass(mode) {

    if (
        mode === "ARM" ||
        mode === "THR HLD"
    ) {

        return "mode-white";
    }


    if (
        mode === "CWS R" ||
        mode === "CWS P" ||
        mode === "SINGLE CH"
    ) {

        return "mode-amber";
    }


    return "mode-green";
}



function updateModeColor(element) {

    element.classList.remove(
        "mode-green",
        "mode-white",
        "mode-amber"
    );


    if (element.value === "") {

        return;
    }


    element.classList.add(
        getModeColorClass(
            element.value
        )
    );
}



/* =========================================================
   ANSWER DISPLAY
   ========================================================= */

function answerModeHTML(mode) {

    if (mode === "") {

        return `
        <span class="answer-blank">
        ---
        </span>
        `;
    }


    const colorClass =
        getModeColorClass(mode);


    let answerClass =
        "answer-green";


    if (
        colorClass ===
        "mode-white"
    ) {

        answerClass =
            "answer-white";
    }


    if (
        colorClass ===
        "mode-amber"
    ) {

        answerClass =
            "answer-amber";
    }


    return `
    <span class="${answerClass}">
    ${mode}
    </span>
    `;
}



/* =========================================================
   SHUFFLE
   ========================================================= */

function shuffle(array) {

    const shuffled =
        [...array];


    for (
        let i =
        shuffled.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            shuffled[i],
            shuffled[j]
        ] =
        [
            shuffled[j],
            shuffled[i]
        ];
    }


    return shuffled;
}

   MAIN MENU
   ========================================================= */

    document

/* =========================================================

   ========================================================= */

/* =========================================================
   QUIZ MODE
   ========================================================= */

function startQuizMode() {

    currentMode =
        "quiz";


    activeQuestions =
        shuffle(
            questionBank
        )
        .slice(
            0,
            QUIZ_QUESTION_COUNT
        );


    startSession();
}



/* =========================================================
   RANDOM PRACTICE
   ========================================================= */

function startRandomPractice() {

    currentMode =
        "practice-random";


    activeQuestions =
        shuffle(
            questionBank
        );


    startSession();
}



/* =========================================================
   STAGE-BY-STAGE PRACTICE
   ========================================================= */

function startStagePractice() {

    currentMode =
        "practice-stage";


    activeQuestions = [];


    stageOrder.forEach(
        stage => {

            const stageQuestions =
                questionBank.filter(
                    question =>
                    question.stage === stage
                );


            activeQuestions.push(
                ...stageQuestions
            );
        }
    );


    startSession();
}



/* =========================================================
   START SESSION
   ========================================================= */

function startSession() {

    currentQuestion = 0;

    score = 0;


    document
        .getElementById(
            "modeMenu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "practiceMenu"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "resultsArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "quizArea"
        )
        .style.display =
        "block";


    loadQuestion();
}



/* =========================================================
   LOAD QUESTION
   ========================================================= */

function loadQuestion() {

    const q =
        activeQuestions[
            currentQuestion
        ];


    document
        .getElementById(
            "scenario"
        )
        .innerHTML =
        `

        <div class="scenario-line">

            <span class="scenario-label">
            VERTICAL:
            </span>

            <span class="scenario-condition">
            ${q.vertical}
            </span>

        </div>


        <div class="scenario-line">

            <span class="scenario-label">
            HORIZONTAL:
            </span>

            <span class="scenario-condition">
            ${q.horizontal}
            </span>

        </div>


        <div class="scenario-line">

            <span class="scenario-label">
            AFDS:
            </span>

            <span class="scenario-condition">
            ${q.afdsCondition}
            </span>

        </div>

        `;


    document
        .getElementById(
            "questionCounter"
        )
        .textContent =
        `Question ${currentQuestion + 1} / ${activeQuestions.length}`;



    if (
        currentMode === "quiz"
    ) {

        document
            .getElementById(
                "score"
            )
            .textContent =
            `Score: ${score}`;

    }

    else if (
        currentMode ===
        "practice-stage"
    ) {

        document
            .getElementById(
                "score"
            )
            .textContent =
            "Stage Practice";

    }

    else {

        document
            .getElementById(
                "score"
            )
            .textContent =
            "Random Practice";
    }



    const stageName =
        document.getElementById(
            "stageName"
        );


    if (
        currentMode ===
        "practice-stage"
    ) {

        stageName.textContent =
            q.stage;

    }

    else {

        stageName.textContent =
            "";
    }



    [
        "at",
        "roll",
        "pitch",
        "afds"
    ].forEach(
        id => {

            const element =
                document
                .getElementById(id);


            element.value = "";

            element.disabled =
                false;


            element
                .classList
                .remove(
                    "correct",
                    "wrong",
                    "mode-green",
                    "mode-white",
                    "mode-amber"
                );
        }
    );



    const feedback =
        document
        .getElementById(
            "feedback"
        );


    feedback.textContent =
        "";

    feedback.className =
        "feedback";



    document
        .getElementById(
            "checkButton"
        )
        .style.display =
        "inline-block";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "none";
}



/* =========================================================
   CHECK ANSWER
   ========================================================= */

function checkAnswer() {

    const q =
        activeQuestions[
            currentQuestion
        ];


    const at =
        document.getElementById("at");

    const roll =
        document.getElementById("roll");

    const pitch =
        document.getElementById("pitch");

    const afds =
        document.getElementById("afds");



    if (
        (q.at !== "" && !at.value) ||
        (q.roll !== "" && !roll.value) ||
        (q.pitch !== "" && !pitch.value) ||
        (q.afds !== "" && !afds.value)
    ) {

        document
            .getElementById(
                "feedback"
            )
            .textContent =
            "Select all required FMA modes.";


        return;
    }



    let completelyCorrect =
        true;



    if (
        at.value === q.at
    ) {

        at.classList.add(
            "correct"
        );

    } else {

        at.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    if (
        roll.value === q.roll
    ) {

        roll.classList.add(
            "correct"
        );

    } else {

        roll.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    if (
        pitch.value === q.pitch
    ) {

        pitch.classList.add(
            "correct"
        );

    } else {

        pitch.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    if (
        afds.value === q.afds
    ) {

        afds.classList.add(
            "correct"
        );

    } else {

        afds.classList.add(
            "wrong"
        );

        completelyCorrect =
            false;
    }



    at.disabled =
        true;

    roll.disabled =
        true;

    pitch.disabled =
        true;

    afds.disabled =
        true;



    const feedback =
        document
        .getElementById(
            "feedback"
        );



    if (
        completelyCorrect
    ) {


        if (
            currentMode ===
            "quiz"
        ) {

            score++;
        }


        feedback.textContent =
            "Correct";


        feedback.className =
            "feedback correct-text";

    }

    else {


        feedback.innerHTML =
        `

        Correct FMA:

        <div class="answer-fma">

            ${answerModeHTML(q.at)}

            |

            ${answerModeHTML(q.roll)}

            |

            ${answerModeHTML(q.pitch)}

            |

            ${answerModeHTML(q.afds)}

        </div>

        `;


        feedback.className =
            "feedback wrong-text";
    }



    if (
        currentMode ===
        "quiz"
    ) {

        document
            .getElementById(
                "score"
            )
            .textContent =
            `Score: ${score}`;
    }



    document
        .getElementById(
            "checkButton"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "nextButton"
        )
        .style.display =
        "inline-block";
}



/* =========================================================
   NEXT QUESTION
   ========================================================= */

function nextQuestion() {

    currentQuestion++;


    if (
        currentQuestion >=
        activeQuestions.length
    ) {

        finishSession();

    }

    else {

        loadQuestion();
    }
}



/* =========================================================
   FINISH SESSION
   ========================================================= */

function finishSession() {

    document
        .getElementById(
            "quizArea"
        )
        .style.display =
        "none";


    document
        .getElementById(
            "resultsArea"
        )
        .style.display =
        "block";


    document
        .getElementById(
            "restartButton"
        )
        .style.display =
        "inline-block";


    document
        .getElementById(
            "menuButton"
        )
        .style.display =
        "inline-block";



    if (
        currentMode ===
        "quiz"
    ) {


        const percentage =
            Math.round(
                (
                    score /
                    activeQuestions.length
                )
                * 100
            );


        document
            .getElementById(
                "practiceFinished"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "finalScore"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "finalPercent"
            )
            .style.display =
            "block";


        document
            .getElementById(
                "finalScore"
            )
            .innerHTML =
            `Your score:<br>${score} / ${activeQuestions.length}`;


        document
            .getElementById(
                "finalPercent"
            )
            .textContent =
            `${percentage}%`;

    }

    else {


        document
            .getElementById(
                "finalScore"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "finalPercent"
            )
            .style.display =
            "none";


        document
            .getElementById(
                "practiceFinished"
            )
            .style.display =
            "block";
    }
}



/* =========================================================
   RESTART CURRENT MODE
   ========================================================= */

function restartCurrentMode() {

    if (
        currentMode ===
        "quiz"
    ) {

        startQuizMode();
    }


    else if (
        currentMode ===
        "practice-random"
    ) {

        startRandomPractice();
    }


    else {

        startStagePractice();
    }
}
